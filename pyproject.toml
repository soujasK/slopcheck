[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "slopwatch"
version = "0.1.0"
description = "Don't feed your agent slop. Measure and filter low-quality web search results."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "SlopWatch contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
# SerpApi's official agent tooling (14 agent frameworks); slopwatch.filter.serpapi_tools
agents = ["serpapi-search-tools>=1.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
  "ruff>=0.6",
  "types-PyYAML",
]

[project.scripts]
slopwatch = "slopwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["slopwatch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]  # asserts are fine; tests and invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PT018"]
"slopwatch/report/observatory.py" = ["E501"]  # HTML/CSS/SVG templates

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["slopwatch"]

[[tool.mypy.overrides]]
module = ["serpapi", "serpapi.*", "serpapi_search_tools", "serpapi_search_tools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=slopwatch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["slopwatch"]
