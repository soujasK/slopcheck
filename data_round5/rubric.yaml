# Rubric v4: weights fitted on 257 development items (56 low), LLM label sets round3, main (slopwatch fit; procedure in slopwatch/fit.py).
# 5-fold out-of-fold: precision 0.8, recall 0.2857, F1 0.4211, flagged 20; precision floor met.
# Coefficients: no_author 0.8, anonymous 0.595, sells_directly 1.1771, title_off_query 1.0552, text_off_query 1.4251, thin -0.5913, ad_heavy 0.0, affiliate_present -0.2113, listicle -0.352, no_about_contact -0.158, near_duplicate 0.0, official_source -0.6575

version: 4
status: frozen

bands:
  low: 0.501
  mixed: 0.2505

rules:
  - id: no_author
    weight: 0.1583
    all:
      - {signal: has_author, eq: false}
    reason: "no named author"

  - id: anonymous
    weight: 0.1178
    all:
      - {signal: has_author, eq: false}
      - {signal: has_date, eq: false}
    reason: "no author or date"

  - id: sells_directly
    weight: 0.233
    all:
      - {signal: sells_directly, eq: true}
    reason: "the site sells products on this page (cart, buy button or product markup)"

  - id: title_off_query
    weight: 0.2089
    all:
      - {signal: query_title_coverage, lt: 0.5}
    reason: "title and headings cover {query_title_coverage:.0%} of the query's words"

  - id: text_off_query
    weight: 0.2821
    all:
      - {signal: query_text_coverage, lt: 0.6}
    reason: "main text covers {query_text_coverage:.0%} of the query's words"

  - id: thin
    weight: -0.117
    all:
      - {signal: text_len, lt: 1500}
    reason: "thin main text ({text_len} chars)"

  - id: affiliate_present
    weight: -0.0418
    all:
      - {signal: affiliate_links, gte: 1}
    reason: "contains affiliate links ({affiliate_links})"

  - id: listicle
    weight: -0.0697
    all:
      - {signal: listicle, eq: true}
    reason: "'best X' listicle pattern"

  - id: no_about_contact
    weight: -0.0313
    all:
      - {signal: has_about_contact, eq: false}
    reason: "no about or contact page linked"

  - id: official_source
    weight: -0.1301
    all:
      - {signal: official_source, eq: true}
    reason: "official source (government, education or the organisation's own help pages)"

