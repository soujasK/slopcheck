# Ad-serving, header-bidding and third-party tracking domains. Matched by host
# suffix against <script src> and <iframe src>, and as plain substrings of inline
# scripts (e.g. "googlesyndication.com" inside an inline loader). The signal counts
# DISTINCT domains from this list referenced in the page's static HTML, so a site
# that loads 20 bidder scripts from one exchange counts once.
# Scripts injected later by JavaScript are not seen (limitation).

