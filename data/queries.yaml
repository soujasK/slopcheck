# SlopWatch measurement query set.
#
# status: draft -> frozen. Set `status: frozen` and commit this file BEFORE any
# collection; `slopwatch collect` refuses to spend credits on a draft plan.
#
# Queries are phrased the way people in India search (English).
#
# Every query is tagged `locale_neutral` BEFORE the subset draw. false = only
# meaningful in India (INR prices, "in india", Aadhaar/PAN/UAN/UPI/FASTag, CIBIL,
# PPF/ELSS/SIP, Indian tax regimes, Indian brands such as Dolo 650, Indian
# product categories such as RO purifiers, dengue, Ayurveda, "indian" diets).
#
# Engine change (2026-10-03, before any measurement collection): the second India
# engine was Bing, but SerpApi's Bing engine returned unusable results for India
# in three probes (mkt=en-IN: empty, then first-word-only junk; cc=IN: empty).
# It is replaced by DuckDuckGo (kl=in-en), the third engine in Bevendorff et al.
# The probes are recorded in data/serpapi_ledger.jsonl and fixtures/.
# Yahoo (yahoo_domain=in) was added on 2026-10-03 as a third, widely known engine,
# also before collection. Yahoo and DuckDuckGo both draw heavily on Bing's index,
# so they are reported as the "Bing family", not as independent engines.
#
# DuckDuckGo (India), Yahoo (India) and Google (US) run on the same 20-query
# subset: 5 per category,
# drawn from the locale-neutral pool only with random.Random(seed) over categories
# and ids in sorted order (slopwatch.queries.select_subset). The ids below are
# that draw written out for review; loading fails if they ever stop matching the
# tags and seed, so the subset cannot be hand-picked. Neutral pool sizes: health 6,
# finance 5, product 5, tech 5, so the seed only decides the health draw.
#
# Report framing: "India vs US on locale-neutral queries".
#
# Locale/engine parameters live in slopwatch/queries.py (LOCALE_PARAMS).

version: 1
status: frozen

subset:
  seed: 2026
  per_category: 5
  ids: [health-01, health-03, health-06, health-07, health-10,
        finance-06, finance-07, finance-08, finance-09, finance-10,
        product-06, product-07, product-08, product-09, product-10,
        tech-06, tech-07, tech-08, tech-09, tech-10]

plan:
  - locale: IN
    engines: [google]
    queries: all       # 40 credits
  - locale: IN
    engines: [duckduckgo, yahoo]
    queries: subset    # 40 credits
  - locale: US
    engines: [google]
    queries: subset    # 20 credits  (total 100)

queries:
  # -- health -----------------------------------------------------------------
  - {id: health-01, category: health, text: "best medicine for acidity and gas without prescription", locale_neutral: true}
  - {id: health-02, category: health, text: "home remedies to increase platelet count in dengue", locale_neutral: false}
  - {id: health-03, category: health, text: "normal blood sugar level after eating for diabetics", locale_neutral: true}
  - {id: health-04, category: health, text: "is it safe to take dolo 650 every day", locale_neutral: false}
  - {id: health-05, category: health, text: "ayurvedic treatment for high blood pressure", locale_neutral: false}
  - {id: health-06, category: health, text: "vitamin d deficiency symptoms in women", locale_neutral: true}
  - {id: health-07, category: health, text: "how to reduce uric acid naturally", locale_neutral: true}
