name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,agents]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Tests (offline: no keys, no network, fixtures only)
        run: pytest
      - name: Report reproduces from committed data
        run: slopwatch report --cache-mode replay --out /tmp/observatory.html
